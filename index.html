<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <nav class="navbar">
        <i class="ri-menu-line menu"></i>
        <h2>Melody</h2>
        <div class="search-bar">
            <input type="text" placeholder="Search songs...">
            <i class="ri-search-line search"></i>
        </div>
    </nav>

    <aside class="sidebar hide">
        <section class="logo">
            <i class="ri-music-2-fill"></i>
            <h3>Melody</h3>
        </section>
        <section class="options">
            <div class="songs optn">
                <i class="ri-music-2-line"></i>
                <h4>Songs</h4>
            </div>
            <div class="playlists optn">
                <i class="ri-play-list-line"></i>
                <h4>Playlists</h4>
            </div>
        </section>


    </aside>

    <main class="main">
        <section class="greet">
            <div class="text">
                <h1>Good Evening, Sakib Raza👋</h1>
                <p>Listen to what you love.</p>
            </div>
            <div>
                <button><i class="ri-play-mini-fill"></i>Resume Playing</button>
            </div>
        </section>

        <section class="songs">
            <h2>All Songs</h2>
        </section>
        
        <section class="titles">
            <p>TITLE</p>
            <p class="duration">DURATION</p>
        </section>

        <section class="song-list">
            <section class="song">
                <div class="details">
                    <img src="" alt="">
                    <div class="name">
                        <h5>Song Name</h5>
                        <p>Singer Name</p>
                    </div>
                </div>
                <div class="duration">
                    <p>3:21</p>
                </div>
            </section>
            <section class="song">
                <div class="details">
                    <img src="" alt="">
                    <div class="name">
                        <h5>Song Name</h5>
                        <p>Singer Name</p>
                    </div>
                </div>
                <div class="duration">
                    <p>3:21</p>
                </div>
            </section>
        </section>
    </main>

    <footer class="foot">
        <div class="mobile">
            <div class="details">
                <img src="" alt="">
                <div class="name">
                    <h5 class="title m-title">Song Name</h5>
                    <p class="artist m-artist">Singer Name</p>
                </div>
            </div>
            <i class="ri-play-circle-fill m-play"></i>
            <i class="ri-pause-circle-fill m-pause"></i>
        </div>

        <div class="laptop">
            <div class="details">
                <img src="" alt="">
                <div class="name">
                    <h5 class="title l-title">Song Name</h5>
                    <p class="artist l-artist">Singer Name</p>
                </div>
            </div>
            
            <div class="btns">
                <i class="ri-skip-back-fill backbtn"></i>
                <i class="ri-play-circle-fill l-play"></i>
                <i class="ri-pause-circle-filln l-pause"></i>
                <i class="ri-skip-forward-fill nextbtn"></i>
            </div>

            <div class="controls">
                <input type="range" id="progress" value="0" min="0" max="100">
                <input type="range" id="volume" value="1" min="0" max="1" step="0.01">
            </div> 

        </div>
        
    </footer>

    <script src="app.js"></script>
</body>
</html>
