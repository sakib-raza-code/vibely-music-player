<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibely</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <nav class="navbar">
        <i class="ri-menu-line menu"></i>
        <h2>Vibely</h2>
        <div class="search-bar">
            <input type="text" class="search-input" placeholder="Search songs...">
            <i class="ri-search-line search"></i>
        </div>
    </nav>

    <aside class="sidebar hide">
        <section class="logo">
            <i class="ri-music-2-fill"></i>
            <h3>Vibely</h3>
        </section>
        <section class="options">
            <div class="songs optn">
                <i class="ri-music-2-line"></i>
                <h4>Songs</h4>
            </div>
            <div class="playlists optn">
                <i class="ri-play-list-line"></i>
                <h4>Playlists</h4>
            </div>
        </section>


    </aside>

    <main class="main">
        <section class="greet">
            <div class="text">
                <h1>Good Evening, Sakib Raza👋</h1>
                <p>Listen to what you love.</p>
            </div>
            <div>
                <button id="resume"><i class="ri-play-mini-fill top-icon"></i>Resume Playing</button>
            </div>
        </section>

        <section class="songs">
            <h2>All Songs</h2>
        </section>
        
        <section class="titles">
            <p>TITLE</p>
            <p class="duration">DURATION</p>
        </section>

        <section class="song-list">
        </section>
    </main>

    <footer class="foot">
        <div class="mobile">

            <div class="details">
                <img class="mobile-cover" src="" alt="cover img">
                <div class="name">
                    <h5 class="title m-title">Song Name</h5>
                    <p class="artist m-artist">Singer Name</p>
                </div>
            </div>

            <div class="mobile-btns">
                <i class="ri-skip-back-fill backbtn"></i>
                <i class="ri-play-circle-fill playbtn"></i>
                <i class="ri-skip-forward-fill nextbtn"></i>
            </div>
        </div>
        
        <div class="m-progress-bar">
            <input type="range" id="progress" value="0" min="0" max="100">
        </div>

        <div class="laptop">
            <div class="details">
                <img class="laptop-cover" src="" alt="cover img">
                <div class="name">
                    <h5 class="title l-title">Song Name</h5>
                    <p class="artist l-artist">Singer Name</p>
                </div>
            </div>
            
            <div class="btns">
                <i class="ri-skip-back-fill backbtn"></i>
                <i class="ri-play-circle-fill playbtn"></i>
                <i class="ri-skip-forward-fill nextbtn"></i>
            </div>

            <div class="controls">
                <!-- <div class="l-progress-bar">
                    <span class="current-time">0:00</span>
                    <input type="range" id="progress" value="0" min="0" max="100">
                    <span class="total-time">0:00</span>
                </div> -->
                <div class="volume-bar">
                    <input type="range" id="volume" value="0.3" min="0" max="1" step="0.01">
                    <span class="total-volume">0%</span>
                </div>
            </div> 

        </div>
        
    </footer>

    <script src="app.js"></script>
</body>
</html>
